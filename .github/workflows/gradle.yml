name: Java CI with Gradle

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 15 * * 1-5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: zulu
        java-version: 25
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Build and test
      run: ./gradlew build
