# Local defaults; deployments set SPRING_DATASOURCE_URL, _USERNAME and _PASSWORD
spring.datasource.url=jdbc:mariadb://localhost:3306/db
spring.datasource.username=filmbag
spring.datasource.hikari.maxLifetime=595000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
# Loads genres and scores of a page of films in a few queries instead of one per film
spring.jpa.properties.hibernate.default_batch_fetch_size=100
# Sends inserts and updates of a request in batches instead of one statement each
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.flyway.baseline-on-migrate=true

# Let imports and queued journal writes finish on shutdown
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=30s

server.port=18080
# The API and Actuator share the /resources prefix
management.endpoints.web.base-path=/resources/actuator
# Imports answer when they finish, so allow more than the container's default of 30 s
spring.mvc.async.request-timeout=5m

# Redis holding the journal (FILMBAG_JOURNAL_HOST, FILMBAG_JOURNAL_PORT)
filmbag.journal.host=localhost
filmbag.journal.port=6379

# Film provider that imports read from (FILMBAG_PROVIDER_URL, FILMBAG_PROVIDER_FILMSPERIMPORT)
filmbag.provider.url=http://localhost:8080/resources/suggestions
filmbag.provider.films-per-import=50
