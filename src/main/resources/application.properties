spring.datasource.url=jdbc:mariadb://172.19.0.3:3306/db
spring.datasource.username=root
spring.datasource.password=
spring.datasource.hikari.maxLifetime=595000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
# Loads genres and scores of a page of films in a few queries instead of one per film
spring.jpa.properties.hibernate.default_batch_fetch_size=100

spring.flyway.baseline-on-migrate=true

# Let imports and queued journal writes finish on shutdown
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=30s

server.port=18080

redis.host=172.19.0.2
redis.port=6379

external.provider.filmrequest.url=http://localhost:8080/resources/suggestions
external.provider.filmrequest.limit=50
