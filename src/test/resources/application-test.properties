# Overrides of application.properties for tests; the containers supply the database and Redis connections
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.user.name=user
spring.security.user.password=password

# Keeps the offsets of film creation times, so films read back equal the films sent
spring.jackson.datatype.datetime.ADJUST_DATES_TO_CONTEXT_TIME_ZONE=false

filmbag.provider.url=http://localhost:1234
