spring.datasource.username=root
spring.datasource.password=
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.flyway.clean-disabled=false

spring.security.user.name=user
spring.security.user.password=password
spring.jpa.open-in-view=false

# Jackson 3 (TestRestTemplate) and Jackson 2 (Jersey, DataLoader)
spring.jackson.datatype.datetime.ADJUST_DATES_TO_CONTEXT_TIME_ZONE=false
spring.jackson2.deserialization.ADJUST_DATES_TO_CONTEXT_TIME_ZONE=false

redis.host=127.0.0.1
redis.port=43210

external.provider.filmrequest.url=http://localhost:1234
