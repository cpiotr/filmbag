services:
  db:
    image: mariadb:11.4
    volumes:
      - db-data:/var/lib/mysql
      - ./database/create-db.sql:/docker-entrypoint-initdb.d/V000__create_db.sql:ro
    # No published port: the application reaches the database over the compose network
    environment:
      - MARIADB_DATABASE=db
      - MARIADB_USER=filmbag
      - MARIADB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD to the database password}
      - MARIADB_RANDOM_ROOT_PASSWORD=1
      # Upgrades a data directory created by an older MariaDB on first start
      - MARIADB_AUTO_UPGRADE=1
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
  journal:
    image: redis:8.4-alpine
    # The journal is the backup of the database, so write every change to disk
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - journal-data:/data
  filmbag:
    build:
      context: .
      args:
        - APP_VERSION=0.0.1
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://db:3306/db
      - SPRING_DATASOURCE_USERNAME=filmbag
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD to the database password}
      - FILMBAG_JOURNAL_HOST=journal
      # Set FILM_PROVIDER_URL, for example in an .env file next to this one, to import from elsewhere
      - FILMBAG_PROVIDER_URL=${FILM_PROVIDER_URL:-http://192.168.122.1:8080/resources/suggestions}
      - SPRING_SECURITY_USER_NAME=${FILMBAG_USER:-filmbag}
      - SPRING_SECURITY_USER_PASSWORD=${FILMBAG_PASSWORD:?Set FILMBAG_PASSWORD to the API password}
      - LOGGING_LEVEL_PL_CIRUK=INFO
      # The heap starts small and may grow to 75% of mem_limit. Under this limit the JVM picks
      # Serial GC (pauses of about 1 ms here). A fixed -Xms1G with ZGC kept the whole heap
      # committed: about 1.2 GiB, where snapshot and replay of 20k films peak at about 0.4 GiB.
      - JDK_JAVA_OPTIONS=-XX:MaxRAMPercentage=75
        -Xss2M
        -XX:InitialCodeCacheSize=128m
        -XX:ReservedCodeCacheSize=128m
        -XX:+PreserveFramePointer
        -Xlog:gc:stdout:time
    mem_limit: 768m
    # Longer than the 30 s the application waits for imports and journal writes on shutdown
    stop_grace_period: 40s
    ports:
      - "18080:18080"
    depends_on:
      db:
        condition: service_healthy
      journal:
        condition: service_started

volumes:
  db-data:
  journal-data:
