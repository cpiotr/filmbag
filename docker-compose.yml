services:
  db:
    image: mariadb:11.4
    volumes:
      - ./database/create-db.sql:/docker-entrypoint-initdb.d/V000__create_db.sql:ro
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=true
      - MYSQL_DATABASE=db
      # Upgrades a data directory created by an older MariaDB on first start
      - MARIADB_AUTO_UPGRADE=1
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "3306:3306"
  journal:
    image: redis:8.4-alpine
  filmbag:
    build:
      context: .
      args:
        - APP_VERSION=0.0.1
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://db:3306/db
      - REDIS_HOST=journal
      - EXTERNAL_PROVIDER_FILMREQUEST_URL=http://192.168.122.1:8080/resources/suggestions
      - EXTERNAL_PROVIDER_FILMREQUEST_LIMIT=50
      - SPRING_SECURITY_USER_NAME=${FILMBAG_USER:-filmbag}
      - SPRING_SECURITY_USER_PASSWORD=${FILMBAG_PASSWORD:?Set FILMBAG_PASSWORD to the API password}
      - LOGGING_LEVEL_PL_CIRUK=INFO
      - JDK_JAVA_OPTIONS=-Xmx1G
        -Xms1G
        -Xss2M
        -XX:InitialCodeCacheSize=128m
        -XX:ReservedCodeCacheSize=128m
        -XX:+PreserveFramePointer
        -XX:+UseZGC
        -Xlog:gc:stdout:time
    ports:
      - "18080:18080"
    depends_on:
      db:
        condition: service_healthy
      journal:
        condition: service_started
